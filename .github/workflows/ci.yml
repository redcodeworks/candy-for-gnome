# SPDX-License-Identifier: MIT
# Branching (GitLab Flow): feature branches -> testing -> main.
# Dev lane: the run on every push to a feature branch (any branch but main and testing), and on pull requests into testing.
# Testing lane: a push to testing (a merged PR) runs the same run. Both check only the featured (starred) schemes per scheme; the manual
# dispatch with full=true (the default) is the way to check every scheme. Nothing is published; main is the reviewed result.
# The jobs `test` and `secrets` are the required checks on testing and main: do not rename them.
name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [testing]
  workflow_dispatch:
    inputs:
      full:
        description: 'Every per-scheme check (hygiene, regeneration, selftest, install/switch/update/remove loop) for every scheme instead of the featured ones only (a dispatched run is full by default)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The required check "test": lint, recipe behaviour and, for the featured schemes, hygiene, regeneration, selftest, the install loop (tools/test.sh).
  # Runs in Fedora because the generators read the stock GTK 3, GTK 4 and GNOME Shell stylesheets from the installed
  # libraries: the committed files were generated on Fedora 45, so a Fedora 45 container reproduces them. If a stock
  # stylesheet changes upstream, the regeneration check fails: run `just generate <scheme>` and commit the result.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: fedora:45
    steps:
      - name: Install git (needed by checkout)
        run: dnf -y install git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # dnf5 keeps what it downloads in /var/cache/libdnf5 only with keepcache=1; the cache is keyed on the package list, so a repeat run reads the rpms
      # from the cache instead of downloading them (a miss just downloads; a new Fedora build of a package is fetched by dnf as usual). The directory does not
      # exist in the bare container: restoring creates it, and the post step saves it after the install.
      - name: Cache the downloaded packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/libdnf5
          key: dnf-${{ hashFiles('tools/test-packages.txt') }}
          restore-keys: dnf-
      - name: Install the test dependencies (the same list the local test container uses)
        run: dnf -y --setopt=keepcache=1 install $(cat tools/test-packages.txt)
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the test suite
        # Every per-scheme check runs for the featured schemes only (TEST_SCOPE=featured; the list is FEATURED_THEMES in tools/themectl.sh and is printed at
        # the top of the log); the checks that are not per scheme always run. A manual dispatch with full=true runs every scheme (TEST_ALL=1).
        env:
          TEST_ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '1' || '' }}
          TEST_SCOPE: featured
        run: tools/test.sh ci

  # The required check "secrets": no credentials in the history.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # A bump changes these two lines: take both from the release's checksums file (gitleaks_<version>_checksums.txt).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, SHA-256 checked before it runs)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks detect --no-banner --redact -v
