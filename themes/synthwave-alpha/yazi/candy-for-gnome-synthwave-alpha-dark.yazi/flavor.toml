title_error = { fg = "#ff3493" }

[filetype]

rules = [
	{ mime = "**/image/*", fg = "#00b0b1" },
	{ mime = "**/{audio,video}/*", fg = "#adad3e" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fa00f2" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#00a273" },
	{ mime = "vfs/{absent,stale}", fg = "#878286" },
	{ url = "*", fg = "#f2f2e3" },
	{ url = "*/", fg = "#ab73de" },
]
