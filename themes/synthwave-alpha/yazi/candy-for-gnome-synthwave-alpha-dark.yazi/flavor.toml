# Synthwave Alpha, dark variant.

[mgr]
cwd = { fg = "#00b0b1" }

find_keyword  = { fg = "#adad3e", bold = true, italic = true, underline = true }
find_position = { fg = "#fa00f2", bold = true, italic = true }

marker_copied   = { fg = "#00a273", bg = "#00a273" }
marker_cut      = { fg = "#ff3493", bg = "#ff3493" }
marker_marked   = { fg = "#00b0b1", bg = "#00b0b1" }
marker_selected = { fg = "#adad3e", bg = "#adad3e" }

count_copied   = { fg = "#241b30", bg = "#00a273" }
count_cut      = { fg = "#241b30", bg = "#ff3493" }
count_selected = { fg = "#241b30", bg = "#adad3e" }

border_symbol = "│"
border_style  = { fg = "#878286" }

[tabs]
active   = { fg = "#241b30", bg = "#ab73de", bold = true }
inactive = { fg = "#ab73de", bg = "#453d4d" }

[mode]
normal_main = { fg = "#241b30", bg = "#ab73de", bold = true }
normal_alt  = { fg = "#ab73de", bg = "#453d4d" }
select_main = { fg = "#241b30", bg = "#00b0b1", bold = true }
select_alt  = { fg = "#00b0b1", bg = "#453d4d" }
unset_main  = { fg = "#241b30", bg = "#c17968", bold = true }
unset_alt   = { fg = "#c17968", bg = "#453d4d" }

[status]
perm_sep   = { fg = "#878286" }
perm_type  = { fg = "#ab73de" }
perm_read  = { fg = "#adad3e" }
perm_write = { fg = "#ff3493" }
perm_exec  = { fg = "#00a273" }

progress_label  = { fg = "#f2f2e3", bold = true }
progress_normal = { fg = "#00a273", bg = "#5e5762" }
progress_error  = { fg = "#adad3e", bg = "#ff3493" }

[pick]
border   = { fg = "#ab73de" }
active   = { fg = "#fa00f2", bold = true }
inactive = {}

[input]
border   = { fg = "#ab73de" }
title    = {}
value    = {}
hint     = { fg = "#878286", italic = true }
selected = { reversed = true }

[cmp]
border = { fg = "#ab73de" }

[tasks]
border  = { fg = "#ab73de" }
