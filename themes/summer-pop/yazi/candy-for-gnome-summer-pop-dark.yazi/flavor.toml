title_error = { fg = "#ff51a8" }

[filetype]

rules = [
	{ mime = "**/image/*", fg = "#00e5e5" },
	{ mime = "**/{audio,video}/*", fg = "#fffb00" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff23ff" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8eff1e" },
	{ mime = "vfs/{absent,stale}", fg = "#8f8f8c" },
	{ url = "*", fg = "#ffffff" },
	{ url = "*/", fg = "#2d96ff" },
]
