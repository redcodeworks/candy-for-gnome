red = ["#cc0000","#ff3617"]
orange = ["#f57900","#bf9856"]
green = ["#4e9a06","#3ba184"]
[dark.exact]
"#26ab62" = "#3ba184"
"#26a269" = "#3ba184"      # GTK4 stock success green
"#3584e4" = "#eefb87"
"#eeeeec" = "#f2f4f9"

[light]
ramp = [[0,"#1f242f"],[46,"#1f242f"],[145,"#93969e"],[224,"#dfe1e7"],
        [237,"#e5e8ed"],[246,"#f2f4f9"],[255,"#f2f4f9"]]
fg = "#1f242f"
top = "#f2f4f9"
accent_fg = "#1f2437"
