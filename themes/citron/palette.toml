"#2ec27e" = "#2c7862"      # GTK4 stock success green (light)
"#2e3436" = "#1f242f"
"#f6f5f4" = "#f2f4f9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f242f"],[34.67,"#1f242f"],[55.33,"#1f242f"],[66.33,"#2b303c"],
        [86.67,"#5a5e68"],[156,"#b3b6bc"],[179,"#b3b6bc"],[250,"#f2f4f9"],
        [255,"#f2f4f9"]]
fg = "#f2f4f9"
top = "#f2f4f9"
accent_fg = "#1f242f"
view = "#1f242f"
[shell.dark.fam]
blue = ["#3584e4","#eefb87"]
red = ["#c01c28","#ff3617"]
orange = ["#ff7800","#e8883a"]
green = ["#26a269","#3ba184"]
[shell.dark.exact]
"#cd9309" = "#bf9856"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b3b6bc"      # web-login title, dim text
"#54545a" = "#2b303c"      # notification/message card: surface
"#45454a" = "#252a36"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f242f"],[46,"#1f242f"],[145,"#93969e"],[224,"#dfe1e7"],
