title = "Citron"
gtk_name = "Citron"
shell_name = "Citron-Shell"
credit = "Citron: own palette (a lime-yellow accent theme), no upstream source"
default_accent = "blue"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f242f"],[53,"#1f242f"],[66,"#2b303c"],
        [91,"#5a5e68"],[145,"#7e828a"],[238,"#f2f4f9"],[255,"#f2f4f9"]]
fg = "#f2f4f9"
top = "#f2f4f9"
