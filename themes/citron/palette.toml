red = ["#c01c28","#d91d00"]
orange = ["#e66100","#b35a00"]
green = ["#26a269","#2c7862"]
[shell.light.exact]
"#e5a50a" = "#866733"      # warning yellow
"#a5a5b7" = "#93969e"

