# SPDX-License-Identifier: MIT
# Role file for tools/palette-from-scheme.py (-> palette.toml). Gruvbox Material (sainnhe/gruvbox-material, MIT).
# The values are the ones the previous hand-written palette.toml used: dark = MEDIUM backgrounds (bg0 #282828),
# light = a hard-contrast block.
# COLOURS (the Ptyxis built-in palette is the source of truth, ids in tools/ptyxis-ids.py): bg_deep, fg, the six [<variant>.ansi] accents and the real
# black, white and brights in [<variant>.terminal] are the built-in's, so the terminal and the toolkit themes show the same colours. A colour that
# differs from it is a listed nudge ([<variant>.nudge], with the reason; tools/ptyxis-compare.py --check enforces this).
# Dark: built-in "Gruvbox Material" (flat, dark only; generated by Ptyxis from Gogh, https://github.com/Gogh-Co/Gogh); fg #d4be98. Light: NO built-in exists, so the light values below stay as they
# were (no_builtin in [light.terminal]) and the terminal shows the dark built-in in both modes.
title = "Gruvbox Material"
gtk_name = "Gruvbox-Material"
shell_name = "Gruvbox-Material-Shell"
credit = "sainnhe/gruvbox-material (MIT)"
ptyxis = "Gruvbox Material"
ptyxis_reason = "there is no light Gruvbox Material built-in, so the dark built-in is used in both modes."
ptyxis_brights_differ = "Kevin, 2026-11-15: the other terminals use lightened brights (Dracula-derived rule); Ptyxis stays on its built-in palette"
default_accent = "blue"

[dark]
bg_deep = "#282828"
bg = "#32302f"
surface = "#45403d"
surface_high = "#5a524c"
fg = "#d4be98"
fg_dim = "#a89984"
comment = "#928374"
selection = "#504945"
red = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green = "#a9b665"
cyan = "#89b482"
blue = "#7daea3"
magenta = "#d3869b"
purple = "#d3869b"
warning_fg = "#1d2021"
[dark.ansi]
orange = "#e78a4e"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"

[light]
bg_deep = "#f9f5d7"
bg = "#f5edca"
surface = "#f2e5bc"
surface_high = "#eee0b7"
fg = "#4f3829"
comment = "#928374"
selection = "#eee0b7"
red = "#c14a4a"
orange = "#c35e0a"
yellow = "#b47109"
green = "#6c782e"
cyan = "#4c7a5d"
blue = "#45707a"
magenta = "#945e80"
purple = "#945e80"
warning_fg = "#1d2021"
[light.ansi]
orange = "#c35e0a"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#c14a4a"
green = "#6c782e"
yellow = "#b47109"
blue = "#45707a"
magenta = "#945e80"
cyan = "#4c7a5d"
[light.adw]
secondary_sidebar = "#f3eac7"   # hand-picked in the old libadwaita file; the rule (bg/surface mix) would give #f4e9c3

[dark.terminal]
source = "Gruvbox Material"   # Ptyxis built-in id
black = "#3c3836"   # Color0
white = "#d4be98"   # Color7
# Brights 8-15: Kevin's decision, 2026-11-15 (this scheme's DARK variant only). The Ptyxis built-in has every bright equal to its standard colour; the other
# terminals (Ghostty, Alacritty, kitty, Helix, Yazi, bat, eza, zellij, Claude Code) get these lightened brights (Dracula's rule: colours 1-6 lightness +0.10
# and saturation +0.05 in HLS, hue unchanged; bright black lifted to a mid grey; bright white a little lighter and less tinted). Ptyxis stays on its built-in
# palette: `ptyxis_brights_differ` at the top accepts exactly this difference (Color8-15 of the dark variant) for tools/ptyxis-compare.py.
bright_black = "#928179"   # Color8  (built-in #3c3836)
bright_red = "#f3918c"     # Color9  (built-in #ea6962)
bright_green = "#bfcb83"   # Color10 (built-in #a9b665)
bright_yellow = "#e6bd7c"  # Color11 (built-in #d8a657)
bright_blue = "#98c6bb"    # Color12 (built-in #7daea3)
bright_magenta = "#e3a9b9" # Color13 (built-in #d3869b)
bright_cyan = "#a4cb9e"    # Color14 (built-in #89b482)
bright_white = "#d5c8b0"   # Color15 (built-in #d4be98)

[light.terminal]
no_builtin = "no Ptyxis built-in has a light Gruvbox Material (the built-in of that name is dark only); the values stay as before"
foreground = "#654735"   # reference (a softer ink than the role fg #4f3829)
background = "#f5edca"   # reference: the window colour
# Brights 8-15 of the LIGHT variant (Kevin, 2026-11-15, "prototype B"): Dracula-light's rule, lightness about unchanged and saturation about 0.11 lower (a softer, greyer
# bright); bright black a muted grey-brown (the background/foreground mix at 45 percent foreground), bright white a touch darker. Dark variants use the opposite
# direction (lighter); this is the decision for Gruvbox Material only. The variant has no built-in, so there is nothing to compare these with.
bright_black = "#b4a287"    # Color8  (was #f2e5bc = Color0)
bright_red = "#b45858"      # Color9  (was #c14a4a)
bright_green = "#666f37"    # Color10 (was #6c782e)
bright_yellow = "#aa6f14"   # Color11 (was #b47109)
bright_blue = "#506a70"     # Color12 (was #45707a)
bright_magenta = "#876c7d"  # Color13 (was #945e80)
bright_cyan = "#576f60"     # Color14 (was #4c7a5d)
bright_white = "#543b2c"    # Color15 (was #654735)
