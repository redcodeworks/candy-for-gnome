	{ mime = "**/image/*", fg = "#069aa4" },
	{ mime = "**/{audio,video}/*", fg = "#ada110" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a680ac" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8e8a8e" },
