perm_read  = { fg = "#dc53ff" }
perm_write = { fg = "#ff4988" }
perm_exec  = { fg = "#06c993" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#06c993", bg = "#60606e" }
progress_error  = { fg = "#dc53ff", bg = "#ff4988" }

[pick]
border   = { fg = "#f69154" }
