[filetype]

rules = [
	{ mime = "**/image/*", fg = "#60adec" },
	{ mime = "**/{audio,video}/*", fg = "#dc53ff" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ec89cb" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#06c993" },
	{ mime = "vfs/{absent,stale}", fg = "#8c8c96" },
	{ url = "*", fg = "#ffffff" },
	{ url = "*/", fg = "#f69154" },
]
