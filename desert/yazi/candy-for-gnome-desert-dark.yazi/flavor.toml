[filetype]

rules = [
	{ mime = "**/image/*", fg = "#ffa0a0" },
	{ mime = "**/{audio,video}/*", fg = "#f0e68c" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffdead" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#98fb98" },
	{ mime = "vfs/{absent,stale}", fg = "#959595" },
	{ url = "*", fg = "#ffffff" },
	{ url = "*/", fg = "#d39457" },
]
